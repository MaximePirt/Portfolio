load_module modules/ngx_http_modsecurity_module.so;

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	ssl_protocols TLSv1.2 TLSv1.3;
	include       mime.types;
	server_tokens off;

	# Limit packet size
	client_body_buffer_size 128k;
	client_max_body_size 12m;

	limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

	# Redirect HTTP to HTTPS
	server {
		listen 80;
		listen [::]:80;
		server_name DOMAIN_NAME;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

	
		location / {
			if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
				add_header Allow "GET, HEAD, OPTIONS" always;
				return 405;
			}
			return 301 https://$host$request_uri;
		}
	}

	# Main server block
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name localhost DOMAIN_NAME;

		ssl_certificate /etc/nginx/certs/fullchain.pem_DOMAIN_NAME.crt;
		ssl_certificate_key /etc/nginx/certs/privkey.pem_DOMAIN_NAME.key;
	
		# Enable ModSecurity
		modsecurity on;
		# Additional nginx security headers (CORS)
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
		add_header X-Frame-Options "DENY" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;
		ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
		ssl_prefer_server_ciphers off;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 1d;


		location / {
			limit_req zone=general burst=40 nodelay;
			if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
				add_header Allow "GET, HEAD, OPTIONS" always;
				return 405;
			}
			root /usr/share/nginx/html;
			try_files $uri $uri/ /index.html;
		}
		
	}
}